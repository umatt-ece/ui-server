version: "3.9"

services:
  fastapi:
    image: fastapi-image
    ports:
      - "8000:8000"
    depends_on:
      - redis
    networks:
      - redis

  redis:
    image: redis:latest
    container_name: redis-container
    ports:
      - "6379:6379"
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      - redis

networks:
  redis:
    driver: bridge